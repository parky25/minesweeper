<!DOCTYPE html>
<html lang='ko'>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지뢰찾기</title>
  <link rel='stylesheet' href='style.css'>
</head>
<body>
  <div id="mainScreen">
    <div id="mainScreenContent">
      <div id="title">지뢰찾기</div>
      <div id="mainScreenBtn">
        <div id="diffBoard"></div>
        <button id="scoreBtn" class="clickBtn"></button>
      </div>
    </div>
  </div>
  <div id="gameScreen">
    <div id="gameScreenContent">
      <div id="gameScreenTopMessage">
        <div id="timeMessage"></div>
        <div id="mineNumMessage"></div>
      </div>
      <div id="topBtn">
        <button id="flagBtn"></button>
      </div>
      <div id="board"></div>
      <div id="bottomBtn">
        <button id="startBtn"></button>
        <button id="mainBtn"></button>
      </div>
      <div id="winMessage"></div>
    </div>
  </div>
  <div id="scoreScreen">
    <div id="scoreBox">
      <div id="easyBest" class=scoreText></div>
      <div id="normalBest" class=scoreText></div>
      <div id="hardBest" class=scoreText></div>
    </div>
    <div id="scoreScreenBtn">
      <button id="mainBtn2" class="clickBtn"></button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
